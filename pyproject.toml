[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benq-monitor-control"
version = "0.1.0"
description = "Wayland tray app controlling the BenQ MA320U over DDC/CI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "chrisOTM" }]
keywords = ["benq", "ma320u", "ddc", "ddcutil", "monitor", "kde", "plasma", "wayland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
# PySide6 is provided by the system package (pacman: pyside6), not by pip.
dependencies = []

[project.urls]
Homepage = "https://github.com/chrisOTM/benq-monitor-control"
Issues = "https://github.com/chrisOTM/benq-monitor-control/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
benq-monitor-control = "benq_monitor_control.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benq_monitor_control = [
    "ui/qml/*.qml",
    "ui/qml/pages/*.qml",
    "ui/icons/*.svg",
    "ui/i18n/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs a connected BenQ MA320U (deselected by default)"]
addopts = "-m 'not hardware'"
